[project]
name = "yt-dlp-emby"
version = "0.1.0"
description = "Download YouTube and Dropout.tv videos with yt-dlp for Emby."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bgutil-ytdlp-pot-provider>=2.0.0",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "yt-dlp[default]>=2026.8.19",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "itsdangerous>=2.2",
]

[project.scripts]
yt-dlp-emby = "yt_dlp_emby.cli:main"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "itsdangerous>=2.2",
]

[tool.pytest.ini_options]
addopts = "-m 'not network'"
testpaths = ["tests"]
markers = [
    "network: tests that contact YouTube",
    "web: needs the [server] extra",
]

[tool.uv.build-backend]
module-name = "yt_dlp_emby"
module-root = "src"
source-exclude = [
    "web/**",
    "**/server/static/**",
]
