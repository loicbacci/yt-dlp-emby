[project]
name = "yt-emby"
version = "0.1.0"
description = "Download YouTube and Dropout.tv videos with yt-dlp for Emby."
readme = "README.md"
authors = [
    { name = "Loïc Baccigalupi", email = "loic@bacci.ch" }
]
requires-python = ">=3.11"
dependencies = [
    "bgutil-ytdlp-pot-provider>=2.0.0",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "yt-dlp[default]>=2026.8.19",
]

[project.scripts]
yt-emby = "yt_emby.cli:main"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = "-m 'not network'"
testpaths = ["tests"]
markers = [
    "network: tests that contact YouTube",
]
